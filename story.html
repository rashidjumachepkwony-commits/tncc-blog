<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story | Teso North Cross Country CBO</title>
  <meta name="description" content="Read stories and news from Teso North Cross Country CBO." />
  <link rel="canonical" href="https://rashidjumachepkwony-commits.github.io/tncc-blog/story.html" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Teso North Cross Country CBO" />
  <meta property="og:title" content="Story | Teso North Cross Country CBO" />
  <meta property="og:description" content="Read stories and news from Teso North Cross Country CBO." />
  <meta property="og:image" content="https://rashidjumachepkwony-commits.github.io/tncc-blog/hero-event.jpg.jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#073b2b" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <script>try{if(localStorage.getItem('tncc-theme')==='dark')document.body.classList.add('dark')}catch(e){}</script>
  <div data-site-header></div>

  <main id="main-content">
    <section class="section-sm">
      <div class="container">
        <div class="story-detail" data-story-detail></div>

        <section class="section-sm" aria-labelledby="related-heading" data-related-section>
          <div class="section-heading">
            <span class="eyebrow">Keep reading</span>
            <h2 id="related-heading">Related stories</h2>
          </div>
          <div class="related-grid" data-related-list></div>
        </section>

        <section class="story-comments-card" data-story-comments>
          <div class="story-comments-head">
            <h2>Comments</h2>
            <span class="story-comments-count" data-story-comment-count></span>
          </div>
          <div class="story-comments-list" data-story-comment-list></div>
          <div class="story-comment-form">
            <label class="sr-only" for="comment-input" hidden>Write a comment</label>
            <textarea id="comment-input" data-story-comment-input rows="3" placeholder="Share a thought..."></textarea>
            <div class="story-comment-form-row">
              <button class="btn btn-primary btn-small" type="button" data-story-comment-submit>Post comment</button>
              <a class="btn btn-secondary btn-small" href="login.html" data-story-comment-login>Sign in to comment</a>
            </div>
            <p class="story-comments-hint" data-story-comment-hint></p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
  <div class="toast" aria-live="polite"></div>
</body>
</html>
