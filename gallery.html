<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery | Teso North Cross Country CBO</title>
  <meta name="description" content="Browse the TNCC photo gallery: cross-country races, community gatherings and partner moments from Teso North, Kenya." />
  <link rel="canonical" href="https://tesonorthcrosscountry.co.ke/gallery.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Teso North Cross Country CBO" />
  <meta property="og:title" content="Photo Gallery | Teso North Cross Country CBO" />
  <meta property="og:description" content="A visual record of people, participation, support and the energy behind the movement." />
  <meta property="og:url" content="https://tesonorthcrosscountry.co.ke/gallery.html" />
  <meta property="og:image" content="https://tesonorthcrosscountry.co.ke/runners%20(10).jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Photo Gallery | Teso North Cross Country CBO" />
  <meta name="twitter:description" content="A visual record of people, participation, support and the energy behind the movement." />
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#073b2b" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <script>try{if(localStorage.getItem('tncc-theme')==='dark')document.body.classList.add('dark')}catch(e){}</script>
  <div data-site-header></div>

  <main id="main-content">
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Gallery</span></nav>
          <span class="eyebrow">Gallery</span>
          <h1 data-ce="gallery:hero-title">Moments, people and stories in motion.</h1>
          <p data-ce="gallery:hero-text">A visual record of people, participation, support and the energy behind the movement.</p>
        </div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="gallery-filters" data-gallery-filters role="group" aria-label="Filter gallery by category"></div>
        <div class="gallery-grid" data-gallery-grid></div>
      </div>
    </section>
  </main>

  <div class="gallery-modal" data-gallery-modal role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <div class="gallery-modal-inner">
      <button class="gallery-close" type="button" data-gallery-close aria-label="Close photo viewer">&times;</button>
      <button class="gallery-nav prev" type="button" data-gallery-prev aria-label="Previous photo">&lsaquo;</button>
      <img src="hero-event.jpg.jpeg" alt="Gallery photo" />
      <button class="gallery-nav next" type="button" data-gallery-next aria-label="Next photo">&rsaquo;</button>
      <div class="gallery-caption-modal" data-gallery-caption></div>
    </div>
  </div>

  <footer data-site-footer></footer>
  <div class="toast" aria-live="polite"></div>
</body>
</html>
