<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Teso North Cross Country CBO</title>
    <meta name="description" content="Sign in to the Teso North Cross Country administration portal." />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="login-page">
    <script>if (localStorage.getItem('tncc-theme') === 'dark') document.body.classList.add('dark');</script>
    <main class="login-shell">
      <div class="login-background-shape login-shape-one"></div>
      <div class="login-background-shape login-shape-two"></div>
      <div class="login-topbar">
        <a class="login-back-link" href="index.html" aria-label="Back to TNCC home"><span aria-hidden="true">←</span> Back to site</a>
        <button class="login-theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">◐</button>
      </div>
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-branding">
          <img class="login-logo" src="logo.jpeg" alt="Teso North Cross Country logo" />
          <div><strong>Teso North</strong><span>Cross Country CBO</span></div>
        </div>
        <div class="login-intro">
          <span class="login-kicker">Staff access</span>
          <h1 id="login-title">Welcome back</h1>
          <p id="login-description">Sign in to continue to your account.</p>
        </div>
        <form id="tnccLoginForm" class="login-form" novalidate>
          <div class="login-field">
            <label for="login-email">Email address</label>
            <div class="login-input-wrap"><span class="login-input-icon" aria-hidden="true">@</span><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div>
          </div>
          <div class="login-field">
            <label for="login-password">Password</label>
            <div class="login-input-wrap"><span class="login-input-icon" aria-hidden="true">&#8226;</span><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required /><button class="login-password-toggle" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">&#9673;</button></div>
          </div>
          <div class="login-form-meta"><span>Authorized staff only</span><span class="login-secure-mark"><span aria-hidden="true">&#10003;</span> Secure sign-in</span></div>
          <button class="login-primary-button" type="submit"><span class="login-button-spinner" aria-hidden="true"></span><span class="login-submit-label">Sign in</span></button>
          <div class="login-divider"><span>or continue with</span></div>
          <button class="login-google-button" type="button" id="googleLoginBtn"><span class="google-icon" aria-hidden="true">G</span><span>Continue with Google</span></button>
        </form>
        <p class="login-account-switch"><span id="login-switch-text">Need an account?</span> <button type="button" id="login-mode-toggle">Create one</button></p>
        <p class="login-support">Having trouble signing in? <a href="contact.html">Contact support</a></p>
      </section>
      <p class="login-footer">© <span data-year></span> Teso North Cross Country CBO <span aria-hidden="true">·</span> Run. Unite. Transform.</p>
    </main>
    <div class="toast" aria-live="polite"></div>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const form = document.getElementById('tnccLoginForm');
        const googleBtn = document.getElementById('googleLoginBtn');
        const submitButton = form.querySelector('.login-primary-button');
        const submitLabel = form.querySelector('.login-submit-label');
        const passwordInput = document.getElementById('login-password');
        const passwordToggle = document.getElementById('togglePassword');
        const modeToggle = document.getElementById('login-mode-toggle');
        const modeText = document.getElementById('login-switch-text');
        const loginTitle = document.getElementById('login-title');
        const loginDescription = document.getElementById('login-description');
        let authMode = 'signin';
        const getClient = () => window.tnccSupabase || (window.TNCC_CONFIG && window.supabase ? window.supabase.createClient(window.TNCC_CONFIG.supabaseUrl, window.TNCC_CONFIG.supabaseAnonKey) : null);
        const setLoading = (loading) => { submitButton.disabled = loading; googleBtn.disabled = loading; submitButton.classList.toggle('is-loading', loading); submitLabel.textContent = loading ? (authMode === 'signup' ? 'Creating account...' : 'Signing in...') : (authMode === 'signup' ? 'Create account' : 'Sign in'); };
        const setAuthMode = (mode) => { authMode = mode; const signingUp = mode === 'signup'; loginTitle.textContent = signingUp ? 'Request access' : 'Welcome back'; loginDescription.textContent = signingUp ? 'Create an account for developer approval.' : 'Sign in to continue to your account.'; submitLabel.textContent = signingUp ? 'Create account' : 'Sign in'; modeText.textContent = signingUp ? 'Already registered?' : 'Need an account?'; modeToggle.textContent = signingUp ? 'Sign in' : 'Create one'; };
        modeToggle.addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
        passwordToggle.addEventListener('click', () => { const showing = passwordInput.type === 'text'; passwordInput.type = showing ? 'password' : 'text'; passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password'); passwordToggle.setAttribute('aria-pressed', String(!showing)); passwordToggle.textContent = showing ? '◉' : '◌'; });
        const redirectIfSignedIn = async () => { const client = getClient(); if (!client) return; const { data: { user } } = await client.auth.getUser(); if (user) window.location.href = 'admin.html'; };
        await redirectIfSignedIn();
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!form.reportValidity()) return;
          const client = getClient();
          if (!client) { showToast('Supabase config is not set. Add your project URL and anon key first.', 'error'); return; }
          setLoading(true);
          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          const result = authMode === 'signup'
            ? await client.auth.signUp({ email, password })
            : await client.auth.signInWithPassword({ email, password });
          const { data, error } = result;
          if (error) { setLoading(false); showToast(error.message, 'error'); return; }
          if (authMode === 'signup') {
            const notificationEndpoint = window.TNCC_CONFIG?.notificationEndpoint;
            if (notificationEndpoint) {
              fetch(notificationEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'registration', payload: { email } }) }).catch(error => console.error('Access notification failed:', error));
            }
            setLoading(false); showToast('Account created. The developer will review your access request.', 'success'); form.reset(); setAuthMode('signin'); return;
          }
          if (data.user) {
            const { data: profileData, error: profileError } = await client.from('profiles').select('role').eq('id', data.user.id).single();
            if (profileError || !profileData || profileData.role !== 'admin') { setLoading(false); showToast('This account is not authorized for admin access.', 'error'); await client.auth.signOut(); return; }
            window.location.href = 'admin.html';
          } else setLoading(false);
        });
        googleBtn.addEventListener('click', async () => {
          const client = getClient();
          if (!client) { showToast('Supabase config is not set. Add your project URL and anon key first.', 'error'); return; }
          googleBtn.disabled = true; googleBtn.classList.add('is-loading');
          const redirectUrl = new URL('admin.html', window.location.href).toString();
          const { error } = await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl } });
          if (error) { googleBtn.disabled = false; googleBtn.classList.remove('is-loading'); showToast(error.message, 'error'); }
        });
      });
    </script>
  </body>
</html>
