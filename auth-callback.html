<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in status | Teso North Cross Country CBO</title>
    <meta name="description" content="Completing your TNCC sign-in." />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <style>
      .auth-status-card { width: min(100%, 468px); padding: 38px 42px 32px; border: 1px solid rgba(255,255,255,.55); border-radius: 24px; background: rgba(255,255,255,.98); box-shadow: 0 26px 70px rgba(0,0,0,.2); text-align: center; }
      .auth-status-card .login-branding { justify-content: center; }
      .auth-status-card h1 { margin: 0; color: var(--login-forest); font-size: clamp(1.5rem, 5vw, 1.9rem); line-height: 1.12; letter-spacing: -.035em; }
      .auth-status-body { margin: 12px 0 0; color: var(--login-muted); font-size: .88rem; line-height: 1.6; }
      .auth-status-body strong, .auth-status-body code { color: var(--login-ink); }
      .auth-status-hint { margin: 14px auto 0; max-width: 360px; padding: 12px 14px; border: 1px solid #f0dfc0; border-radius: 10px; background: #fffaf0; color: #6b5a2e; font-size: .76rem; line-height: 1.55; text-align: left; }
      .auth-status-hint strong { color: #6b5a2e; }
      .auth-status-actions { display: grid; gap: 12px; margin-top: 24px; }
      .auth-status-actions a, .auth-status-actions button { width: 100%; text-decoration: none; }
      .auth-status-err .login-kicker { color: #c0392b; }
      @media (max-width: 600px) { .auth-status-card { padding: 30px 24px 27px; border-radius: 20px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="assets/js/auth-callback.js" defer></script>
  </head>
<body class="login-page">
    <script src="assets/js/theme-init.js"></script>
    <main class="login-shell">
      <div class="login-background-shape login-shape-one"></div>
      <div class="login-background-shape login-shape-two"></div>
      <div class="login-topbar">
        <a class="login-back-link" href="index.html" aria-label="Back to TNCC home"><span aria-hidden="true">←</span> Back to site</a>
      </div>
      <section class="auth-status-card" aria-live="polite" id="authStatusCard">
        <div class="login-branding">
          <img class="login-logo" src="logo.jpeg" alt="Teso North Cross Country logo" />
          <div><strong>Teso North</strong><span>Cross Country CBO</span></div>
        </div>
        <span class="login-kicker">Staff access</span>
        <h1>Completing your sign-in…</h1>
        <p class="auth-status-body">Please wait a moment while we confirm your account with Google.</p>
        <div class="auth-status-actions" id="authStatusActions" hidden></div>
      </section>
      <p class="login-footer">© <span data-year></span> Teso North Cross Country CBO <span aria-hidden="true">·</span> Run. Unite. Transform.</p>
    </main>
  </body>
</html>
